name: PR Checks

# Gate for every pull request (and every push to main): project standards,
# debug builds of phone + Wear, and JVM unit tests.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # On a PR the checkout is the merge commit, so HEAD^1 is the base branch tip;
      # on a push to main HEAD^1 is the previous main commit.
      - name: Check added lines against AGENTS.md standards
        run: scripts/check-standards.sh HEAD^1

  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APKs and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :wear:assembleDebug -Ppixelplay.enableAbiSplits=true --console=plain

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
